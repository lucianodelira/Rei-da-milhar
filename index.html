<div id="install-banner">

    <button onclick="instalarApp()" type="button" style="background: #4CAF50; color: white; border: none; padding: 10px 20px; border-radius: 999px; font-weight: bold; cursor: pointer;">
      Instalar App
    </button>

  <script>
  (function () {
    var sheet = document.getElementById('supportSheet');
    var handle = document.getElementById('supportHandle');
    var startY = null;

    function setSupportOpen(open) {
      sheet.classList.toggle('open', open);
      handle.setAttribute('aria-expanded', open ? 'true' : 'false');
      sheet.setAttribute('aria-hidden', open ? 'false' : 'true');
      var arrow = handle.querySelector('.arrow');
      if (arrow) arrow.textContent = open ? '\u25BC' : '\u25B2';
    }
    function toggleSupport() {
      setSupportOpen(!sheet.classList.contains('open'));
    }
    handle.addEventListener('click', toggleSupport);
    handle.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleSupport(); }
      if (e.key === 'Escape') setSupportOpen(false);
    });
    handle.addEventListener('touchstart', function (e) {
      if (e.touches && e.touches.length) startY = e.touches[0].clientY;
    }, { passive: true });
    handle.addEventListener('touchend', function (e) {
      if (startY === null || !e.changedTouches || !e.changedTouches.length) return;
      var d = e.changedTouches[0].clientY - startY;
      if (d < -12) setSupportOpen(true);
      else if (d > 12) setSupportOpen(false);
      startY = null;
    }, { passive: true });

  })();
  </script>

  <script>
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    const banner = document.getElementById('install-banner');
    if (banner) banner.style.display = 'block';
  });
  function instalarApp() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function () {
        deferredPrompt = null;
        document.getElementById('install-banner').style.display = 'none';
      });
    }
  }
  </script>
